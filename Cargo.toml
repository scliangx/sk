[package]
name = "sk"
version = "0.1.0"
edition = "2021"
description = "sk - SSH Keys Manager: passwordless SSH configuration tool"
authors = ["scliangx"]
license = "MIT"
repository = "https://github.com/scliangx/sk"
homepage = "https://github.com/scliangx/sk"
documentation = "https://github.com/scliangx/sk#readme"
readme = "README.md"
keywords = ["ssh", "config", "passwordless", "cli", "rust"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
# CLI 解析
clap = { version = "4.5", features = ["derive", "wrap_help", "string"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# 错误处理
thiserror = "2"

# 安全：内存自动清零
zeroize = { version = "1", features = ["derive"] }

# SSH 协议（纯 Rust 实现，可选）
ssh2 = { version = "0.9", optional = true }

# 密钥生成
ed25519-dalek = "2"

# 加密降级存储
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"

# 跨平台钥匙串
keyring = { version = "3", optional = true }

# 跨平台目录
dirs = "6"

# 终端输出
console = "0.15"
colored = "3"

# 进度条
indicatif = "0.17"

# 交互式输入
dialoguer = "0.11"

# 日期时间
chrono = { version = "0.4", features = ["serde"] }

# 异步运行时（批量并发操作时使用）
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros"], optional = true }

# CSV 批量导入
csv = "1"
ssh-key = { version = "0.6.7", features = ["ed25519"] }
clap_complete = "4.6.3"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
serial_test = "3"

[features]
default = ["ssh2-backend", "keyring-backend"]
# 使用 ssh2 (libssh2) 进行 SSH 连接
ssh2-backend = ["dep:ssh2"]
# 使用系统钥匙串存储密码
keyring-backend = ["dep:keyring"]
# 异步支持（批量并发操作）
async-backend = ["dep:tokio"]

[profile.release]
opt-level = "z"     # 优化体积
lto = true          # 链接时优化
strip = true        # 去除调试符号
codegen-units = 1   # 更好的优化
panic = "abort"     # 减小体积
